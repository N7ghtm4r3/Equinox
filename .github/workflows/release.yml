name: release

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Axion reads shared tag history across both release branches.
concurrency:
  group: equinox-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.module }})
    strategy:
      fail-fast: true
      matrix: &modules
        module:
          - ':equinox-core'
          - ':equinox-compose'
          - ':equinox-backend'
          - ':equinox-navigation'
          - ':equinox-miscellaneous:backend-membership'
          - ':equinox-miscellaneous:lazy-pagination-compose-ops'
          - ':equinox-miscellaneous:navigation-compose-util'
    uses: ./.github/workflows/module-management.yml
    with:
      module: ${{ matrix.module }}

  docs-build:
    name: Build documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - &install-docs
        name: Install documentation dependencies
        run: python -m pip install --no-cache-dir mkdocs==1.6.1 mkdocs-material==9.8.0 mkdocs-glightbox==0.5.3
      - name: Build documentation
        run: mkdocs build

  tag:
    name: Tag releases with Axion
    needs: [build, docs-build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.docs-build.result == 'success' ||
           (github.ref == 'refs/heads/develop' && needs.docs-build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      versions: ${{ steps.summary.outputs.table }}
      version: ${{ steps.versions.outputs.root }}
    steps:
      # Do not advance versions again when an operator reruns the tagging job.
      # Reconcile partial tags/publications manually; never rerun all jobs blindly.
      - name: Reject tagging retries
        if: github.run_attempt != '1'
        run: |
          echo '::error::Tagging retries require manual recovery. Reconcile tags and Central before starting a new run.'
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            18
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Create local release tags
        run: |
          ./gradlew createRelease -Prelease.localOnly -Prelease.disableSnapshotsCheck \
            --no-daemon --no-configuration-cache --no-build-cache --console=plain
      - name: Promote release channels
        id: versions
        run: |
          # An empty project path selects the root Gradle project.
          for module in \
            '' \
            :equinox-core \
            :equinox-compose \
            :equinox-backend \
            :equinox-navigation \
            :equinox-miscellaneous:backend-membership \
            :equinox-miscellaneous:lazy-pagination-compose-ops \
            :equinox-miscellaneous:navigation-compose-util; do
            version=$(./gradlew "$module:currentVersion" -q -Prelease.quiet \
              --no-daemon --no-configuration-cache --no-build-cache)
            # Promote unchanged RCs on main; the root release follows the branch too.
            if [[ "$GITHUB_REF_NAME" == main && "$version" == *-rc.* ]] ||
               [[ -z "$module" && "$GITHUB_REF_NAME" == develop && "$version" != *-rc.* ]]; then
              ./gradlew "$module:createRelease" -Prelease.localOnly -Prelease.forceSnapshot \
                -Prelease.disableSnapshotsCheck --no-daemon --no-configuration-cache --no-build-cache --console=plain
              version=$(./gradlew "$module:currentVersion" -q -Prelease.quiet \
                --no-daemon --no-configuration-cache --no-build-cache)
            fi
            name=${module##*:}
            echo "${name:-root}=$version" >> "$GITHUB_OUTPUT"
          done
      - name: Summarize module versions
        id: summary
        env:
          VERSIONS: ${{ toJSON(steps.versions.outputs) }}
        run: |
          {
            echo 'table<<VERSIONS'
            echo '| Module | Version |'
            echo '| --- | --- |'
            jq -r 'del(.root) | to_entries[] | "| \(.key) | \(.value) |"' <<< "$VERSIONS"
            echo 'VERSIONS'
          } >> "$GITHUB_OUTPUT"
      - name: Push release tags with Axion
        env:
          AXION_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :pushRelease -Prelease.customUsername=x-access-token \
            --no-daemon --no-configuration-cache --no-build-cache --console=plain

  publish:
    name: Publish (${{ matrix.module }})
    needs: tag
    # Override skipped-docs propagation on develop, but require successful tags.
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    strategy:
      # A failed upload must not cancel another module's publication in flight.
      fail-fast: false
      matrix: *modules
    uses: ./.github/workflows/module-management.yml
    with:
      module: ${{ matrix.module }}
      publish: true
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  release:
    name: Create GitHub release
    needs: [tag, publish]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The root Axion tag identifies the aggregate release independently of core.
      # If this fails, recover only this job: the Maven publications already succeeded.
      - name: Create the release with all module versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ github.ref == 'refs/heads/develop' }}
          VERSIONS: ${{ needs.tag.outputs.versions }}
        run: |
          printf '%s\n' "$VERSIONS" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes --prerelease="$PRERELEASE" --latest=false

  docs-deploy:
    name: Publish documentation
    needs: [release, docs-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - *setup-python
      - *install-docs
      - name: Deploy documentation
        env:
          # A repository-scoped token triggers the branch-based Pages deployment.
          GH_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo '::error::Missing DOCS_DEPLOY_TOKEN'; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::notice::A newer main commit exists; skipping the outdated documentation deployment.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          mkdocs gh-deploy --force
